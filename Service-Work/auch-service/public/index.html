<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Добро пожаловать</h1>
        
        <div class="form-group">
            <label for="login">Логин:</label>
            <input type="text" id="login" placeholder="Введите логин" autocomplete="off">
        </div>
        
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" placeholder="Введите пароль (мин. 4 символа)">
        </div>
        
        <button onclick="login()">Вход</button>
        <button class="register" onclick="register()">Регистрация</button>
    </div>
    
    <!-- Подключаем клиентский JavaScript -->
    <script src="/script.js"></script>
</body>
</html>
