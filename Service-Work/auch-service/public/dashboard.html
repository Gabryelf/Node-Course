<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .user-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .user-info p {
            margin: 8px 0;
            color: #333;
        }

        .profile-display {
            margin-top: 15px;
        }

        .profile-field {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .profile-field strong {
            display: inline-block;
            width: 120px;
            color: #667eea;
        }

        .profile-field span {
            color: #555;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: #718096;
            color: white;
            width: 100%;
        }

        .btn-logout:hover {
            background: #4a5568;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .message-input {
            margin-top: 20px;
        }

        .result {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Личный кабинет</h1>
            <p>Управление профилем и данные пользователя</p>
        </div>
        
        <div class="content">
            <!-- Информация о пользователе -->
            <div class="section">
                <div class="section-title">📋 Информация о пользователе</div>
                <div class="user-info" id="userInfo">
                    <div class="loading">Загрузка данных пользователя...</div>
                </div>
            </div>

            <!-- Профиль -->
            <div class="section">
                <div class="section-title">👨‍💼 Профиль</div>
                <div id="profileInfo">
                    <div class="loading">Загрузка профиля...</div>
                </div>
            </div>

            <!-- Форма редактирования профиля (скрыта по умолчанию) -->
            <div class="section" id="editForm" style="display: none;">
                <div class="section-title">✏️ Редактирование профиля</div>
                <div class="form-group">
                    <label>Полное имя:</label>
                    <input type="text" id="fullName" placeholder="Введите полное имя">
                </div>
                <div class="form-group">
                    <label>О себе:</label>
                    <textarea id="bio" placeholder="Расскажите о себе"></textarea>
                </div>
                <div class="form-group">
                    <label>Дата рождения:</label>
                    <input type="date" id="birthDate">
                </div>
                <div class="form-group">
                    <label>Avatar URL:</label>
                    <input type="text" id="avatarUrl" placeholder="Ссылка на аватар">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="saveProfile()">💾 Сохранить</button>
                    <button class="btn-warning" onclick="cancelEdit()">❌ Отмена</button>
                </div>
            </div>

            <!-- Тестовое сообщение -->
            <div class="section">
                <div class="section-title">💬 Тестовое сообщение</div>
                <div class="form-group message-input">
                    <input type="text" id="message" placeholder="Введите сообщение для анализа">
                </div>
                <button class="btn-secondary" onclick="sendMessage()">📊 Анализировать</button>
                <div class="result" id="result">
                    <div>Длина текста: <span id="length">0</span></div>
                    <div>Количество слов: <span id="wordCount">0</span></div>
                </div>
            </div>

            <!-- Кнопка выхода -->
            <button class="btn-logout" onclick="logout()">🚪 Выйти из системы</button>
        </div>
    </div>
    
    <script src="/dashboard.js"></script>
</body>
</html>
